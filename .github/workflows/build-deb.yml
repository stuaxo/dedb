name: Build Release Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential devscripts debhelper dh-exec dh-python python3-all python3-hatchling python3-click python3-pydantic python3-tomli pybuild-plugin-pyproject fakeroot

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc

      - name: Collect build artifacts
        run: |
          mkdir -p dist
          mv ../*.deb ../*.buildinfo ../*.changes ../*.dsc ../*.tar.* dist/ 2>/dev/null || true
          ls -l dist/

      # debian/control's version floors (pydantic 2, internetarchive 5) mean
      # apt refuses this package on the runner's own Ubuntu release - verify
      # against Debian trixie, the oldest release that meets them, instead.
      - name: Package installs and runs (Debian 13/trixie - the version floor)
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" debian:trixie bash -c '
            set -e
            apt-get update -qq
            apt-get install -y -qq /dist/dedb_*_all.deb
            dedb --version
            test -f /usr/share/bash-completion/completions/dedb
            test -f /usr/share/zsh/vendor-completions/_dedb
            test -f /usr/share/fish/vendor_completions.d/dedb.fish
          '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build wheel and sdist
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

      - name: Render release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          sed -e "s|@VERSION@|${version}|g" -e "s|@REF@|${GITHUB_REF_NAME}|g" \
            .github/release-body.md > release-body.rendered.md
          cat release-body.rendered.md

      - name: Add to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          body_path: release-body.rendered.md
          append_body: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
