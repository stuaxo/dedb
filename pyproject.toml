[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedb"
version = "0.0.12"
description = "DOSEMU2 / DOSBOX compatibility shims"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "internetarchive>=5.0",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
dedb = "dedb.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dedb"]

[dependency-groups]
test = ["pytest>=9.1.1", "tomli-w>=1.2.0"]
lint = ["ruff>=0.16"]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    "jupyter>=1.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# ruff defaults (E4/E7/E9, F) plus import order (I), pyupgrade (UP),
# pycodestyle warnings (W), a slice of bugbear (B) and ruff's own (RUF).
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "RUF"]
