[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dedb"
version = "0.0.5"
description = "DOSEMU2 / DOSBOX compatibility shims"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
dedb = "dedb.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/dedb"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "tomli-w>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
