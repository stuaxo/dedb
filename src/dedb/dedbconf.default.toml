# dedb configuration.
#
# Created from the packaged default the first time dedb ran. Edit freely -
# dedb only writes this file when it is missing, and falls back to these
# same defaults (with a warning) if it is ever unreadable or invalid.

# Installed apps: dotted module paths, each exposing a cli.commands list.
# Mirrors Django's INSTALLED_APPS.
apps = [
    "dedb.dosbox",
    "dedb.gog",
    "dedb.archive",
]

# Shared downloads root. Each app gets a namespaced subdirectory under it
# (<download_dir>/gog/, <download_dir>/archive/, ...). Set this before
# downloading anything; a path under the system temp dir is created
# automatically, anywhere else must exist already. A leading ~ and any
# $VARs are expanded.
# download_dir = "~/downloads"

[dosbox]
# Which real DOSBox binary `dedb run <target> --dosbox` launches.
# "default" picks the first installed of dosbox_staging or dosbox. Other
# recognised values: "dosbox", "dosbox_staging", "dosbox_x", "dosbox_pure".
dosbox = "default"

[archive]
# archive.org screen name whose public favorites `dedb lsarchive` lists.
# Left unset, `lsarchive` prompts for it and offers to save it here.
# favorites_user = "your-archive-org-username"
